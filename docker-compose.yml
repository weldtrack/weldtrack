services:
  frontend:
    build:
      context: ./weldtrackfrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: weldtrack_frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - shared_network

  backend:
    build:
      context: ./weldtrackbackend
      dockerfile: Dockerfile
    container_name: weldtrack_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./weldtrackbackend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://weldtrack:weldtrack_123@postgres:5432/weldtrack_db
    depends_on:
      - postgres
    networks:
      - shared_network

  postgres:
    image: postgres:16-alpine
    container_name: weldtrack_postgres
    environment:
      POSTGRES_USER: weldtrack
      POSTGRES_PASSWORD: weldtrack_123
      POSTGRES_DB: weldtrack_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shared_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: weldtrack_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@weldtrack.com
      PGADMIN_DEFAULT_PASSWORD: weldtrack_123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - shared_network

volumes:
  pgdata:

networks:
  shared_network:
    driver: bridge
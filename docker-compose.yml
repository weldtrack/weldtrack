services:
  frontend:
    build:
      context: ./weldtrackfrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_CDN_URL: ${VITE_CDN_URL}
    container_name: weldtrack_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - shared_network

  backend:
    build:
      context: ./weldtrackbackend
      dockerfile: Dockerfile
    container_name: weldtrack_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://weldtrack:weldtrack_123@postgres:5432/weldtrack_db
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: weldtrack
      MINIO_SECURE: "false"
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.docker_bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - shared_network

  postgres:
    image: postgres:16-alpine
    container_name: weldtrack_postgres
    environment:
      POSTGRES_USER: weldtrack
      POSTGRES_PASSWORD: weldtrack_123
      POSTGRES_DB: weldtrack_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shared_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: weldtrack_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@weldtrack.com
      PGADMIN_DEFAULT_PASSWORD: weldtrack_123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - shared_network

  minio:
    image: minio/minio:latest
    container_name: weldtrack_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - shared_network

volumes:
  pgdata:
  minio_data:

networks:
  shared_network:
    driver: bridge

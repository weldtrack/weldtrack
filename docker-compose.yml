services:
  frontend:
    image: ghcr.io/ruzzgd/weldtrack/frontend:latest
    restart: always
    ports:
      - "8081:80"
    networks:
      - shared_network

  backend:
    image: ghcr.io/ruzzgd/weldtrack/backend:latest
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./weldtrackbackend/.env
    networks:
      - shared_network

networks:
  shared_network:
    external: true
    name: docker_default
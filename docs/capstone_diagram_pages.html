<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WeldTrack Updated Diagram Pages</title>
  <style>
    @page { size: Letter; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Times New Roman", Times, serif; color: #000; }
    .page {
      width: 8.5in;
      height: 11in;
      padding: 0.65in 0.7in 0.45in;
      break-after: page;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page:last-child { break-after: auto; }
    h1 { align-self: stretch; margin: 0 0 0.28in; font-size: 14pt; font-weight: normal; text-align: left; }
    figure { flex: 1; width: 100%; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
    img { display: block; max-width: 100%; max-height: 8.8in; object-fit: contain; }
    figcaption { margin-top: 0.18in; font-size: 11pt; text-align: center; }
    .page-number { margin-top: auto; padding-top: 0.15in; font-size: 11pt; }
  </style>
</head>
<body>
  <section class="page">
    <h1>System Architecture Design</h1>
    <figure>
      <img src="diagrams/weldtrack-architecture.png" alt="WeldTrack system architecture">
      <figcaption>Fig. 2: Updated WeldTrack System Architecture</figcaption>
    </figure>
    <div class="page-number">22</div>
  </section>
  <section class="page">
    <h1>C.1 Use Case Diagram</h1>
    <figure><img src="diagrams/weldtrack-use-case.png" alt="WeldTrack use case diagram"></figure>
    <div class="page-number">38</div>
  </section>
  <section class="page">
    <h1>C.2 Activity Diagram</h1>
    <figure><img src="diagrams/weldtrack-activity.png" alt="WeldTrack activity diagram"></figure>
    <div class="page-number">39</div>
  </section>
  <section class="page">
    <h1>C.3 Sequence Diagram</h1>
    <figure><img src="diagrams/weldtrack-sequence.png" alt="WeldTrack sequence diagram"></figure>
    <div class="page-number">40</div>
  </section>
  <section class="page">
    <h1>C.4 Entity Relationship Diagram (ERD)</h1>
    <figure><img src="diagrams/weldtrack-erd.png" alt="WeldTrack entity relationship diagram"></figure>
    <div class="page-number">41</div>
  </section>
</body>
</html>
